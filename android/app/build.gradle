plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


// Keys for the android play store
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('../fastlane/metadata/envfiles/key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Identity of the app. The upstream values stay the default; custom builds (see
// docs/ci-publishing.md) override them with `-PappId=... -PappName=...` or the
// WGER_APP_ID / WGER_APP_NAME environment variables. Blank values are ignored,
// so an unset CI variable cannot produce an empty id. Only the applicationId
// changes: the namespace (and with it the Kotlin package) stays as it is.
def firstNonBlank = { List candidates ->
    def found = candidates.find { it != null && !it.toString().trim().isEmpty() }
    return found == null ? null : found.toString().trim()
}
def appId = firstNonBlank([project.findProperty('appId'), System.getenv('WGER_APP_ID')]) ?: 'de.wger.flutter'
def appName = firstNonBlank([project.findProperty('appName'), System.getenv('WGER_APP_NAME')]) ?: 'wger'
// The name ends up in a generated values.xml, where quotes and backslashes
// would break aapt
def appNameResource = appName.replace('\\', '\\\\').replace('"', '\\"').replace("'", "\\'")


android {
    namespace = "de.wger.flutter"
    compileSdk = 37
    compileSdkMinor = 0
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }


    defaultConfig {
        // Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId appId
        minSdkVersion 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Overridden by the debug build type. Set here rather than per build
        // type so the profile variant has it as well
        resValue "string", "app_name", appNameResource
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        debug {
            // Own application id and name, so a debug build can sit next to the
            // installed release one on the same device. The launcher icon keeps
            // the wger logo on a different background, see src/debug/res
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "${appNameResource} - debug"
        }
    }
}

flutter {
    source '../..'
}
