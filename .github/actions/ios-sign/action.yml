name: 'iOS signing'
description: >
  Imports a distribution certificate (.p12) into a temporary keychain, installs
  an App Store provisioning profile, checks that both fit the bundle identifier
  and generates the ExportOptions.plist for `flutter build ipa`. Run the
  cleanup step of the calling workflow (it removes the keychain) when done.

inputs:
  cert-p12-base64:
    description: 'Base64 of the distribution certificate exported as .p12'
    required: true
  cert-password:
    description: 'Password of the .p12'
    required: true
  profile-base64:
    description: 'Base64 of the App Store .mobileprovision'
    required: true
  bundle-id:
    description: 'Bundle identifier the app is built with'
    required: true

outputs:
  team-id:
    description: 'Apple developer team id from the provisioning profile'
    value: ${{ steps.sign.outputs.team_id }}
  profile-name:
    description: 'Name of the provisioning profile'
    value: ${{ steps.sign.outputs.profile_name }}
  identity:
    description: 'Name of the signing identity in the keychain'
    value: ${{ steps.sign.outputs.identity }}
  export-options-plist:
    description: 'Path of the generated ExportOptions.plist'
    value: ${{ steps.sign.outputs.export_options }}

runs:
  using: composite
  steps:
    - name: Import certificate and profile
      id: sign
      shell: bash
      env:
        CERT_BASE64: ${{ inputs.cert-p12-base64 }}
        CERT_PASSWORD: ${{ inputs.cert-password }}
        PROFILE_BASE64: ${{ inputs.profile-base64 }}
        BUNDLE_ID: ${{ inputs.bundle-id }}
      run: |
        set -euo pipefail
        umask 077
        fail() { echo "::error title=iOS signing::$1"; exit 1; }

        keychain="$RUNNER_TEMP/wger-signing.keychain-db"
        keychain_password="$(openssl rand -base64 24)"
        echo "::add-mask::$keychain_password"

        printf '%s' "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist-cert.p12" 2>/dev/null \
          || fail "IOS_DIST_CERT_P12_BASE64 is not valid base64. Create it with: base64 -i cert.p12 | pbcopy"
        printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision" 2>/dev/null \
          || fail "IOS_PROVISIONING_PROFILE_BASE64 is not valid base64. Create it with: base64 -i profile.mobileprovision | pbcopy"

        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$RUNNER_TEMP/dist-cert.p12" -P "$CERT_PASSWORD" -t agg -f pkcs12 \
          -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security > /dev/null \
          || fail "Could not import the certificate: wrong IOS_DIST_CERT_PASSWORD or not a .p12 file."
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null

        # Put the keychain first in the search list, keeping the existing ones
        existing="$(security list-keychains -d user | tr -d '"' | xargs)"
        # shellcheck disable=SC2086
        security list-keychains -d user -s "$keychain" $existing
        security default-keychain -s "$keychain"
        echo "WGER_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

        identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(.*\)"$/\1/p' | grep -i 'distribution' | head -1 || true)"
        [[ -n "$identity" ]] || fail "The .p12 holds no valid Apple/iPhone Distribution identity (expired, or exported without the private key?)."

        # Inspect the provisioning profile
        profile_plist="$RUNNER_TEMP/profile.plist"
        security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$profile_plist" 2>/dev/null \
          || fail "IOS_PROVISIONING_PROFILE_BASE64 is not a valid .mobileprovision file."
        pb() { /usr/libexec/PlistBuddy -c "Print $1" "$profile_plist" 2>/dev/null; }
        profile_name="$(pb :Name)"
        profile_uuid="$(pb :UUID)"
        team_id="$(pb :TeamIdentifier:0)"
        profile_app_id="$(pb :Entitlements:application-identifier)"
        expires="$(pb :ExpirationDate || true)"

        if pb :ProvisionedDevices > /dev/null; then
          fail "The profile '$profile_name' lists devices: it is a development or ad hoc profile. Use an App Store distribution profile."
        fi
        # application-identifier is TEAMID.bundle.id, possibly with a wildcard suffix
        # shellcheck disable=SC2053
        if [[ "$team_id.$BUNDLE_ID" != $profile_app_id ]]; then
          fail "The profile '$profile_name' is for '$profile_app_id', not for '$team_id.$BUNDLE_ID' (APP_ID_IOS)."
        fi
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
        echo "WGER_PROFILE_PATH=$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision" >> "$GITHUB_ENV"

        export_options="$RUNNER_TEMP/ExportOptions.plist"
        rm -f "$export_options"
        plist() { /usr/libexec/PlistBuddy -c "$1" "$export_options" > /dev/null; }
        plist "Add :method string app-store-connect"
        plist "Add :teamID string $team_id"
        plist "Add :signingStyle string manual"
        plist "Add :signingCertificate string \"$identity\""
        plist "Add :uploadSymbols bool true"
        plist "Add :manageAppVersionAndBuildNumber bool false"
        plist "Add :provisioningProfiles dict"
        plist "Add :provisioningProfiles:$BUNDLE_ID string \"$profile_name\""

        {
          echo "team_id=$team_id"
          echo "profile_name=$profile_name"
          echo "identity=$identity"
          echo "export_options=$export_options"
        } >> "$GITHUB_OUTPUT"
        echo "Identity:  $identity"
        echo "Profile:   $profile_name ($profile_uuid), team $team_id, expires $expires"
